# Dependabot version updates: a weekly check of the Python dependencies (pyproject.toml and
# uv.lock). Minor and patch bumps share one pull request, and each major bump gets its own, since
# a major is the change most likely to break something. No workflow runs on a pull request, so
# run the test suite on a proposal's branch before merging it. Security updates are switched on
# in the repository settings.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
