[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmail-archiver"
version = "0.2.0"
description = "Archive every Gmail message to local .eml files, with deduplication and tombstones for mail deleted upstream."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jade Naaman" }]
keywords = ["gmail", "backup", "archive", "email", "eml", "imap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: System :: Archiving :: Backup",
]

dependencies = [
    # Direct imports.
    "google-api-python-client>=2.199.0",
    "google-auth-oauthlib>=1.4.1",
    "google-auth>=2.57.0",
    # imap_backup.py relies on 1.x behavior and the imap_tools.imap_utf7 module;
    # the old >=0.39 floor allowed resolving a 0.x release that breaks it.
    "imap-tools>=1.11,<2",

    # Transitive pins for published advisories. These arrive via the Google
    # client libraries, which do not floor them high enough on their own.
    "httplib2>=0.32.0",     # CVE-2026-59939 gzip/deflate decompression bomb
    "idna>=3.15",           # CVE-2026-45409 idna.encode() bypass
    "protobuf>=6.33.5",     # CVE-2026-0994 JSON recursion depth bypass
    "pyasn1>=0.6.4",        # CVE-2026-30922/59884/59885/59886 decoder DoS
    "requests>=2.33.0",     # CVE-2026-25645 insecure temp file reuse
    "urllib3>=2.7.0",       # CVE-2026-44431 cross-origin header leak, -44432 bomb
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",        # CVE-2025-71176 tmpdir handling
    "pytest-cov>=7.0.0",
]

[project.scripts]
gmail-archiver = "gmail_archiver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gmail_archiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
